[package]
name = "chord-romanizer-py"
version = "0.1.12"
edition = "2024"
rust-version = "1.85"
description = "High-level Python bindings for chord-romanizer"
license = "MIT"
repository = "https://github.com/anime-song/chord-romanizer"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
chord-romanizer = { path = "../chord-romanizer-rs" }
pyo3 = { version = "0.29.0", features = ["abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
