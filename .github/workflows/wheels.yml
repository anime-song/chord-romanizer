name: Build native wheels

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 (manylinux2014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Build abi3 wheel and source distribution
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2014"
          args: --release --out dist --sdist
      - name: Install wheel and test from outside the source tree
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist --force-reinstall chord_romanizer
          python -c "import os, shutil; shutil.copytree('tests', os.path.join(os.environ['RUNNER_TEMP'], 'wheel-tests'), dirs_exist_ok=True)"
          cd "$RUNNER_TEMP"
          python -m pytest wheel-tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist/*
          retention-days: 7

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist
      - name: Install wheel and test from outside the source tree
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist --force-reinstall chord_romanizer
          python -c "import os, shutil; shutil.copytree('tests', os.path.join(os.environ['RUNNER_TEMP'], 'wheel-tests'), dirs_exist_ok=True)"
          Set-Location $env:RUNNER_TEMP
          python -m pytest wheel-tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist/*
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Install wheel and test from outside the source tree
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist --force-reinstall chord_romanizer
          python -c "import os, shutil; shutil.copytree('tests', os.path.join(os.environ['RUNNER_TEMP'], 'wheel-tests'), dirs_exist_ok=True)"
          cd "$RUNNER_TEMP"
          python -m pytest wheel-tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/chord-romanizer

    permissions:
      id-token: write

    steps:
      - name: Download all distribution artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
